name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildozer
        run: |
          sudo apt update
          sudo apt install -y git cmake ninja-build python3-pip python3-venv python3-dev \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev libtinfo6 \
            libffi-dev libssl-dev openjdk-17-jdk unzip zip build-essential curl
          pip3 install --user buildozer cython wheel

      - name: Setup Android SDK and NDK
        run: |
          mkdir -p $HOME/.buildozer/android/platform
          cd $HOME/.buildozer/android/platform
          if [ ! -d "android-sdk" ]; then
            mkdir android-sdk
            cd android-sdk
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-6514223_latest.zip
            unzip -q commandlinetools-linux-6514223_latest.zip
            rm commandlinetools-linux-6514223_latest.zip
            yes | tools/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk --licenses
            tools/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          fi
          if [ ! -d "android-ndk-r25b" ]; then
            wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
            unzip -q android-ndk-r25b-linux.zip
            rm android-ndk-r25b-linux.zip
          fi

      - name: Clone python-for-android and patch vosk recipe
        run: |
          mkdir -p $HOME/.buildozer/android/platform
          cd $HOME/.buildozer/android/platform
          if [ ! -d "python-for-android" ]; then
            git clone -b develop --single-branch https://github.com/kivy/python-for-android.git
          fi
          cd python-for-android
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path('pythonforandroid/recipes/vosk/__init__.py')
          s = p.read_text()
          s = s.replace("'srt',", "")
          p.write_text(s)
          print('vosk recipe patched')
          EOF

      - name: Download models via Hugging Face
        run: |
          pip3 install huggingface_hub
          python3 -c "
          from huggingface_hub import snapshot_download
          import os
          os.makedirs('assets/models', exist_ok=True)
          snapshot_download(repo_id='microsoft/Florence-2-base', local_dir='assets/models/florence2')
          snapshot_download(repo_id='Helsinki-NLP/opus-mt-ru-en', local_dir='assets/models/opus-mt-ru-en')
          snapshot_download(repo_id='Helsinki-NLP/opus-mt-en-ru', local_dir='assets/models/opus-mt-en-ru')
          "

      - name: Download Vosk model
        run: |
          wget -q https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip -O vosk.zip
          unzip -q vosk.zip -d assets/models
          rm vosk.zip

      - name: Build APK
        run: |
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_NDK_HOME=$HOME/.buildozer/android/platform/android-ndk-r25b
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-assistant-apk
          path: bin/*.apk